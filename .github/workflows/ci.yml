name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: pwsh

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Hook and branch-policy regressions
        run: |
          npm run test:hooks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:ci-policy
      - name: Canonical frontend quality gates
        run: node scripts/phase0/verify-quality.mjs frontend
      - name: Install Rust formatting tools for generated contracts
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Contracts and application boundaries
        run: npm run check:contracts

  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results
          retention-days: 14

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Canonical backend quality gates
        run: node scripts/phase0/verify-quality.mjs backend

  phase0-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - name: Generate and compare smoke fixtures
        run: |
          $smokeFixtureRoot = Join-Path $env:RUNNER_TEMP 'collectives-phase0-smoke'
          $fixtureA = Join-Path $smokeFixtureRoot 'a'
          $fixtureB = Join-Path $smokeFixtureRoot 'b'
          New-Item -ItemType Directory -Force -Path $smokeFixtureRoot | Out-Null
          node scripts/phase0/generate-fixtures.mjs --out "$fixtureA" --profile smoke --seed phase0-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phase0/generate-fixtures.mjs --out "$fixtureB" --profile smoke --seed phase0-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phase0/verify-fixtures.mjs --left "$fixtureA" --right "$fixtureB" --manifest test-fixtures/phase0/manifest.json
      - name: Run smoke harness and validate schema
        run: |
          $fixtureA = Join-Path $env:RUNNER_TEMP 'collectives-phase0-smoke/a'
          node scripts/phase0/run-benchmarks.mjs --fixture-root "$fixtureA" --artifact-root artifacts/phase0 --native-cold-samples 1 --native-warm-samples 1 --workload-samples 1 --skip-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phase0/verify-artifacts.mjs --root artifacts/phase0 --allow-incomplete
      - name: Upload Phase 0 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-smoke-evidence
          path: artifacts/phase0
          retention-days: 90
