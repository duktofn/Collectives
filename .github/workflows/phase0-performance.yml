name: Phase 0 Performance Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

jobs:
  performance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - name: Verify native process-tree collector
        run: ./scripts/phase0/measure-native.ps1 -Action self-check
      - name: Generate independent fixed-seed fixture pairs
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'collectives-phase0-fixtures'
          New-Item -ItemType Directory -Path $base | Out-Null
          foreach ($profile in @('smoke', 'standard', 'large')) {
            $left = Join-Path $base "$profile-a"
            $right = Join-Path $base "$profile-b"
            node scripts/phase0/generate-fixtures.mjs --out $left --profile $profile --seed phase0-v1
            node scripts/phase0/generate-fixtures.mjs --out $right --profile $profile --seed phase0-v1
            node scripts/phase0/verify-fixtures.mjs --left $left --right $right --manifest test-fixtures/phase0/manifest.json
          }
      - name: Run Windows native release baseline and backend matrix
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'collectives-phase0-fixtures'
          node scripts/phase0/run-benchmarks.mjs `
            --fixture-root (Join-Path $base 'standard-a') `
            --native-smoke-fixture-root (Join-Path $base 'smoke-a') `
            --native-large-fixture-root (Join-Path $base 'large-a') `
            --artifact-root artifacts/phase0 `
            --native-cold-samples 5 `
            --native-warm-samples 10 `
            --native-ui-samples 5 `
            --workload-samples 5 `
            --run-id-file (Join-Path $env:RUNNER_TEMP 'phase0-standard.run-id')
      - name: Run native release smoke coverage for 100 entries and 10KB I/O
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'collectives-phase0-fixtures'
          node scripts/phase0/run-benchmarks.mjs `
            --fixture-root (Join-Path $base 'smoke-a') `
            --artifact-root artifacts/phase0 `
            --workload-samples 5 `
            --backend-only `
            --backend-workloads collection-json-load-mutation,sqlite-link-index-rebuild-search,temporary-file-read-write `
            --run-id-file (Join-Path $env:RUNNER_TEMP 'phase0-smoke.run-id')
      - name: Run native release large coverage for 10K entries and 10MB I/O
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'collectives-phase0-fixtures'
          node scripts/phase0/run-benchmarks.mjs `
            --fixture-root (Join-Path $base 'large-a') `
            --artifact-root artifacts/phase0 `
            --workload-samples 5 `
            --backend-only `
            --backend-workloads collection-json-load-mutation,sqlite-link-index-rebuild-search,temporary-file-read-write `
            --run-id-file (Join-Path $env:RUNNER_TEMP 'phase0-large.run-id')
      - name: Validate selected release evidence and coverage matrix
        run: |
          $standard = Get-Content (Join-Path $env:RUNNER_TEMP 'phase0-standard.run-id') -Raw
          $smoke = Get-Content (Join-Path $env:RUNNER_TEMP 'phase0-smoke.run-id') -Raw
          $large = Get-Content (Join-Path $env:RUNNER_TEMP 'phase0-large.run-id') -Raw
          node scripts/phase0/verify-artifacts.mjs `
            --root artifacts/phase0 `
            --run-id $standard.Trim() `
            --coverage-run-id $smoke.Trim() `
            --coverage-run-id $large.Trim() `
            --require-release
      - name: Upload immutable Phase 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-performance-evidence-windows
          path: artifacts/phase0
          retention-days: 90
